aid: meetanlora-com
name: Anlora
description: >-
  Anlora (meetanlora.com) sells an autonomous AI chatter for OnlyFans talent agencies: a managed service that
  runs day-to-day fan messaging on an agency's existing management platform, with optional human oversight,
  priced as a flat 20% revenue share on AI-generated payouts with a 7-day card-free trial and no technical
  integration. It publishes no REST API, SDK or developer program - its customer dashboard API under /api/ is
  private and session-gated - but it does publish an unusually complete agent-discovery surface on its apex
  host: an A2A agent card at /.well-known/agent-card.json (four public-data benchmark skills; graded flavored -
  no protocolVersion and the card url answers 405 to POST), an MCP manifest at /.well-known/mcp.json for a local
  stdio server (npx -y github:Stanglovicc/anlora-mcp, four read-only OnlyFans-agency cost-benchmark tools, MIT),
  an Agent Skills index with three CC-BY-4.0 SKILL.md files, an llms.txt, an RFC 9116 security.txt with a
  detached signature, a did:web document, a Web Bot Auth key directory and a signed claims ledger. The company
  describes itself as a brand operating pre-incorporation with EU (Hetzner, Nuremberg) hosting, a Better Stack
  status page, and public pricing, terms and privacy pages.

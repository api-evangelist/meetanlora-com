surface_note: >-
  Anlora publishes no REST contract and no network API. Its agent surfaces are a local stdio MCP server with four
  read-only benchmark tools, an A2A agent card with no callable endpoint, and three knowledge skills. The product
  itself is a managed service ("no technical integration") whose dashboard API under /api/ is private and
  session-gated. Every convention below is therefore either stated in a provider document or an honest
  not-applicable; nothing is inferred from a contract that does not exist.

  note: >-
    Everything lives on the apex. meetanlora.com serves an RFC 9116 security.txt with a detached signature, an A2A
    agent card (graded flavored in a2a/), an MCP manifest for a local stdio server, an Agent Skills index, a W3C
    did:web document, a JWKS at the Web Bot Auth http-message-signatures-directory path, an agents.txt pointer
    index, and three self-described "Agentic Reasoning Protocol" (ARP, draft, non-standard) documents: an
    ai-manifest, a signed claims ledger and an LLM intent map. It serves NO openid-configuration,
    oauth-authorization-server, oauth-protected-resource, api-catalog, ai-plugin.json, apis.json, ucp.json, acp.json
    or aauth-resource.json (all HTML 404). www.meetanlora.com 301s every path to the apex. status.meetanlora.com
    (Better Stack) 301s every /.well-known/* path to its own root. api., docs., mcp. and app.meetanlora.com do not
    resolve.
  consent_signals:
    content_signal_header: 'Content-Signal: ai-train=yes, search=yes, ai-input=yes on every HTTP response (observed on GET / 2026-09-19)'
    robots_txt: https://meetanlora.com/robots.txt - explicit Allow for 24 named AI crawlers (GPTBot, ClaudeBot, anthropic-ai, Google-Extended, PerplexityBot ...) and Disallow /api/, /health, /up, /login, /auth/, /passkeys, /team/, /horizon for all agents
    web_bot_auth: JWKS (Ed25519, kid arp-2026-05-13) at /.well-known/http-message-signatures-directory, self-described as "JWKS for IETF Web Bot Auth ... verifies HTTP message signatures Anlora emits on signed outbound requests"
    dns: '_arp.meetanlora.com TXT "v=ARP1; alg=ed25519; pk=..." publishes the same public key'
